# mavlink-router: passes MAVLink between the vehicle and everything that talks
# to it. Edit to match your setup, then rerun install.sh <board>.

[General]
# A ground station can connect with TCP to the board's address, port 5760.
TcpServerPort = 5760
ReportStats = false

# The vehicle, or a simulator (SITL) on your computer, sends to the board's
# host link, port 14550. mavlink-router replies to whoever sent last.
[UdpEndpoint vehicle]
Mode = Server
Address = 0.0.0.0
Port = 14550

# Your tree: a root listening on udpin:0.0.0.0:14560 gets everything here.
[UdpEndpoint tree]
Mode = Normal
Address = 127.0.0.1
Port = 14560
