[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
# Generated by bonsai for {{board}} (esp32-{{chip}}) — Embassy trunk + branches{% if wifi %} + WiFi{% endif %}.

[dependencies]
# esp-hal 1.x runs Embassy through esp-rtos (which provides the executor + the
# embassy-time driver). Logging is defmt, routed over espflash.
esp-hal = { version = "1.2.2", features = ["esp32{{chip}}", "unstable", "defmt"] }
esp-rtos = { version = "0.4.0", features = ["esp32{{chip}}", "embassy", "defmt"{% if wifi %}, "esp-radio", "esp-alloc"{% endif %}] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32{{chip}}"] }
esp-backtrace = { version = "0.20.0", features = ["esp32{{chip}}", "panic-handler", "defmt"] }
esp-println = { version = "0.18.0", features = ["esp32{{chip}}", "defmt-espflash"] }

defmt = "1.1"
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
{% if wifi %}
# WiFi (src/wifi.rs): the radio driver, the heap it allocates from, and the
# network stack branches open sockets on. esp-radio 1.0 is a beta: the first
# release that supports esp-hal 1.2.
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32{{chip}}", "wifi", "esp-alloc", "unstable", "defmt"] }
esp-alloc = { version = "0.11.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = ["defmt", "dhcpv4", "udp", "tcp", "dns", "medium-ethernet", "proto-ipv4"] }
static_cell = "2.1"
{% endif %}
# Your branches' dependencies go here — crates a branch needs to build (a sensor
# driver, a protocol, a data structure). Add them below, then `use` them from
# src/branches/<name>.rs. e.g. `heapless = "0.8"`.

[profile.release]
debug = 2
lto = "fat"
opt-level = "s"
codegen-units = 1
