[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"

# Generated by bonsai for host (native) — Linux trunk + branches.

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-std", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["std"] }
embassy-sync = "0.8.0"
critical-section = { version = "1.2", features = ["std"] }

# Add libraries used by your branches below.

[profile.release]
# A fast, lean binary: whole-program optimisation, full speed, no symbols, and
# abort instead of unwinding on panic (a panic in any thread ends the process —
# restart it with systemd).
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
