[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"

# Generated by bonsai for pi5 (bcm2712) — Linux trunk + branches (bonsai 2).

[dependencies]
# The async runtime the tree runs on (see src/bonsai.rs).
tokio = { version = "1.47", features = ["rt", "macros", "time", "sync", "signal", "net", "io-util"] }

# Add libraries used by your branches below.

[profile.release]
# A fast, lean binary for the Pi 5: whole-program optimisation, full speed (a
# Pi 5 has room to spare, so speed beats size), and no symbols. Panics unwind,
# so the core can set a panicking branch up again instead of ending the program.
lto = true
codegen-units = 1
opt-level = 3
strip = true
