# The tree's graph, read by the `bonsai` CLI (not by cargo). `bonsai sync`
# generates src/links.rs, src/settings.rs and src/branches/mod.rs from it and
# src/messages.rs. The bonsai commands edit it for you and keep its comments;
# after editing it by hand, run `bonsai sync`.

# One table per branch, in the order the core runs them. Its keys become
# constants in src/settings.rs (`settings::<branch>::KEY`), except `rate`:
# ticks per second, each an `Input::Tick` for the branch (`bonsai rate`).
# `bonsai branch add` writes one. For example:
#   [branch.sensor]
#   rate = 1          # an Input::Tick once a second
#   limit = 30.0      # a setting: settings::sensor::LIMIT

# Links: `from` sends `message` to every branch in `to`, in that order
# (`bonsai link <from> <Message> <to…>`). For example:
#   [[link]]
#   from = "sensor"
#   message = "Reading"
#   to = ["display", "logger"]

# Run logs: a folder per run in `dir`, named by when it started
# (logs/2026-09-30_14-00-05/), with a file for each kind set true. Each file
# starts with a START line and ends with an END line (`bonsai record`).
[record]
dir = "logs"        # relative to where the tree runs
events = true       # record!("…") from a branch or an edge
panics = true       # a branch or an edge panicked
errors = false      # every error!/warn! line
edges = false       # edges coming up and going down
keep_runs = 100     # run folders kept, this one included (0: all)
keep_days = 0       # delete run folders older than this (0: never)
max_file_kb = 10240 # past this, a file moves to <kind>.1.log (0: never)
