[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"

# Generated by bonsai for zero-2w (bcm2710a1) — Linux trunk + branches (bonsai 2).

[dependencies]
# The async runtime the tree runs on (see src/bonsai.rs).
tokio = { version = "1.47", features = ["rt", "macros", "time", "sync", "signal", "net", "io-util"] }
# The local time for run logs (already part of tokio).
libc = "0.2"

# Add libraries used by your branches below.

[profile.release]
# A lean binary for the Pi: whole-program optimisation, size over speed, and
# no symbols. Panics unwind, so the core can set a panicking branch up again
# instead of ending the program.
lto = true
codegen-units = 1
opt-level = "s"
strip = true
