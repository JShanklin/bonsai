[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
# Generated by bonsai for {{board}} ({{chip}}) — Embassy trunk + branches.

[dependencies]
# Embassy versions match the embassy-rp release dependency set.
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
{% if chip == "rp2350" -%}
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "binary-info", "executor-thread", "executor-interrupt"] }
{% else -%}
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040", "executor-thread", "executor-interrupt"] }
{% endif -%}

# Logging over RTT (decoded by `probe-rs run`) + a panic handler that prints
# through defmt. See the project README for what defmt is.
defmt = "1.1"
defmt-rtt = "1.3"
panic-probe = "1.0"
cortex-m-rt = "0.7"

# Your branches' dependencies go here — crates a branch needs to build (a sensor
# driver, a protocol, a data structure). Add them below, then `use` them from
# src/branches/<name>.rs. e.g. `heapless = "0.8"`.

[features]
default = ["panic-messages"]
# Print panic messages over defmt. That links in Rust's formatting code — about
# half of a fresh tree's flash. Build with `--no-default-features` for a lean
# image: a panic still halts, and `probe-rs run` still prints its backtrace
# (file:line) from the debug info; only the message text is gone.
panic-messages = ["panic-probe/print-defmt"]

[profile.release]
debug = 2
lto = true
opt-level = "z"
codegen-units = 1
