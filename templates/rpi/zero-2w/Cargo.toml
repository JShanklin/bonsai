[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"

# Generated by bonsai for zero-2w (bcm2710a1) — Linux trunk + branches.

[dependencies]
# Match the Embassy crate versions used by the MCU templates.
embassy-executor = { version = "0.10.0", features = ["platform-std", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["std"] }
embassy-sync = "0.8.0"
critical-section = { version = "1.2", features = ["std"] }

# Add libraries used by your branches below.

[profile.release]
# A lean binary for the Pi (≈35% smaller than cargo's defaults): whole-program
# optimisation, size over speed, no symbols, and abort instead of unwinding on
# panic (a panic in any thread ends the process — restart it with systemd).
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
