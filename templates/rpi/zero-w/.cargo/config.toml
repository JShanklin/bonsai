# `cargo build --release` builds for the Pi; `cargo run --release` copies the
# binary to the Pi and runs it there. `cargo local` runs on this computer.

[build]
target = "arm-unknown-linux-gnueabihf"

[target.arm-unknown-linux-gnueabihf]
# No linker is set: Debian/Ubuntu's `arm-linux-gnueabihf-gcc` builds for ARMv7,
# and its binaries crash on the Zero W's ARMv6 CPU. From another computer, pick
# zigbuild in `bonsai tools`: zig links for ARMv6. On the Zero W, plain cargo works.
# Copy to the Pi and run over ssh. On the Zero W itself, run in place.
runner = ["sh", "-c", '''
[ "$(uname -m)" = armv6l ] && exec "$@"
bin="$1"; shift
scp -q "$bin" "$BONSAI_PI:/tmp/" && exec ssh -t "$BONSAI_PI" "/tmp/${bin##*/}" "$@"
''', "run-on-pi"]

[env]
# Your Pi, as ssh sees it (user@host). `BONSAI_PI=... cargo run` overrides it once.
BONSAI_PI = "pi@raspberrypi.local"

[alias]
local = "run --target host-tuple"        # run on this computer instead
local-test = "test --target host-tuple"  # tests on this computer
